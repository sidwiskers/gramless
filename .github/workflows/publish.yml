name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Run Test Suite
        run: node --test --test-reporter spec tests/*.test.js

      - name: Publish Gramless to NPM with Provenance
        run: |
          CURRENT_VER=$(node -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json')).version);")
          if ! npm view gramless@$CURRENT_VER version >/dev/null 2>&1; then
            npm publish --provenance --access public
          else
            echo "gramless@$CURRENT_VER is already published, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-gramless to NPM with Provenance
        run: |
          cd packages/create-gramless
          CURRENT_VER=$(node -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json')).version);")
          if ! npm view create-gramless@$CURRENT_VER version >/dev/null 2>&1; then
            npm publish --provenance --access public
          else
            echo "create-gramless@$CURRENT_VER is already published, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
