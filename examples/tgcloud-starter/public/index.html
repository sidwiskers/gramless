<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gramless Notes</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #000000);
      --hint-color: var(--tg-theme-hint-color, #999999);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .card {
      background: rgba(128, 128, 128, 0.08);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .note-title { font-weight: bold; margin-bottom: 4px; }
    .note-date { font-size: 11px; color: var(--hint-color); }
  </style>
</head>
<body>
  <div id="app">
    <h1>Gramless Notes</h1>
    <p id="user-greeting">Loading profile...</p>
    <div id="notes-container"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Call Gramless Serverless RPC endpoint
    tg.Serverless.call('getProfile', { includeNotes: true }, (err, result) => {
      const greeting = document.getElementById('user-greeting');
      const container = document.getElementById('notes-container');

      if (err) {
        greeting.textContent = 'Failed to load: ' + (err.message || 'Error');
        return;
      }

      greeting.textContent = `Hello, ${result.user.firstName}!`;

      if (!result.notes || result.notes.length === 0) {
        container.innerHTML = '<div class="card">No notes found. Create one in the bot!</div>';
        return;
      }

      container.innerHTML = result.notes.map(note => `
        <div class="card">
          <div class="note-title">${note.title}</div>
          <div>${note.content}</div>
          <div class="note-date">${new Date(note.createdAt).toLocaleString()}</div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
